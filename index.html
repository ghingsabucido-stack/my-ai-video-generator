
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Video Generator</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10101c;
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(90%, 650px);
      padding: 28px;
      box-sizing: border-box;
      background: #1d1d30;
      border-radius: 18px;
    }
    h1 { color: #c4b5fd; }
    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      box-sizing: border-box;
      border-radius: 10px;
      font: inherit;
      margin: 12px 0;
    }
    button {
      padding: 13px 20px;
      border: 0;
      border-radius: 10px;
      background: #8b5cf6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #message { color: #ddd6fe; line-height: 1.5; }
    #preview {
      margin-top: 20px;
      min-height: 120px;
      border: 1px dashed #777;
      border-radius: 12px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>
<body>
  <main>
    <h1>✨ My AI Video Generator</h1>
    <p>Describe the video you want to create.</p>
    <textarea id="prompt" placeholder="Example: A cute bunny in a magical forest..."></textarea>
    <button onclick="generateVideo()">Generate Video</button>
    <p id="message">Your video preview will appear here.</p>
    <div id="preview">🎬 Video preview</div>
  </main>
  <script>
    function generateVideo() {
      const prompt = document.getElementById("prompt").value.trim();
      const message = document.getElementById("message");
      if (!prompt) {
        message.textContent = "Please enter a video description first.";
        return;
      }
      message.textContent =
        "Your prompt is ready: " + prompt +
        " — This is a demo interface. Connect an AI video model to generate an actual video.";
    }
  </script>
</body>
</html>
